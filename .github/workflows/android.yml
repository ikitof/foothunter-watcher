name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android build cache
        uses: actions/cache@v4
        with:
          path: .buildozer-global
          key: buildozer-android-arm64-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-android-arm64-

      - name: Restore Android signing key
        uses: actions/cache@v4
        with:
          path: .android-signing
          key: footlive-android-signing-v1

      - name: Load Android signing secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .android-signing
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .android-signing/footlive.keystore
          fi

      - name: Protect Android signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .android-signing/footlive.keystore ]; then
            exit 0
          fi
          if gh release view main-latest --json assets --jq '.assets[].name' 2>/dev/null |
              grep -qx 'FootLive.apk'; then
            echo "::error::Android signing key is missing; refusing to publish an incompatible update."
            exit 1
          fi

      - name: Build signed Android APK
        env:
          P4A_RELEASE_KEYSTORE: /home/user/hostcwd/.android-signing/footlive.keystore
        run: |
          chmod +x scripts/build_android.sh
          mkdir -p .buildozer-global
          docker run --rm \
            --volume "$PWD":/home/user/hostcwd \
            --volume "$PWD/.buildozer-global":/root/.buildozer \
            --env P4A_RELEASE_KEYSTORE \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -lc "cd /home/user/hostcwd && ./scripts/build_android.sh"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: FootLive-android
          path: bin/FootLive.apk

  publish-android:
    needs: build-android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: FootLive-android
          path: release-assets

      - name: Publish Android build to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La release est normalement créée par le workflow Windows ; on la crée
          # ici aussi au cas où l'APK serait publié en premier. On NE touche PAS
          # target_commitish : il est réservé au build Windows (mise à jour auto de
          # l'exe), et l'avancer ici ferait croire à un nouvel exe inexistant.
          gh release create main-latest \
            --target "$GITHUB_SHA" --title "Latest main build" \
            --notes-file WHATS_NEW.md --prerelease 2>/dev/null || true

          # Publier l'APK PUIS son marqueur de commit. L'app Android compare ce
          # marqueur (et non target_commitish, qui suit l'exe Windows) pour savoir
          # si une vraie nouvelle version de l'APK est disponible. L'ordre compte :
          # si l'upload de l'APK échoue, le marqueur n'avance pas -> pas de fausse maj.
          gh release upload main-latest \
            "release-assets/FootLive.apk#FootLive.apk" --clobber
          printf '%s' "$GITHUB_SHA" > android-commit.txt
          gh release upload main-latest \
            "android-commit.txt#android-commit.txt" --clobber
