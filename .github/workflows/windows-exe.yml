name: Desktop and Android builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FootLive-windows
          path: dist/FootLive.exe

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Android build cache
        uses: actions/cache@v4
        with:
          path: |
            .buildozer-global
            .buildozer
          key: buildozer-android-arm64-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-android-arm64-

      - name: Restore Android signing key
        uses: actions/cache@v4
        with:
          path: .android-signing
          key: footlive-android-signing-v1

      - name: Load Android signing secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p .android-signing
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .android-signing/footlive.keystore
          fi

      - name: Protect Android signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .android-signing/footlive.keystore ]; then
            exit 0
          fi
          if gh release view main-latest --json assets --jq '.assets[].name' 2>/dev/null |
              grep -qx 'FootLive.apk'; then
            echo "::error::Android signing key is missing; refusing to publish an incompatible update."
            exit 1
          fi

      - name: Build signed Android APK
        env:
          P4A_RELEASE_KEYSTORE: /home/user/hostcwd/.android-signing/footlive.keystore
        run: |
          chmod +x scripts/build_android.sh
          mkdir -p .buildozer-global
          docker run --rm \
            --volume "$PWD":/home/user/hostcwd \
            --volume "$PWD/.buildozer-global":/root/.buildozer \
            --env P4A_RELEASE_KEYSTORE \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -lc "cd /home/user/hostcwd && ./scripts/build_android.sh"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: FootLive-android
          path: bin/FootLive.apk

  publish:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download application artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish rolling main release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete main-latest --yes --cleanup-tag || true
          git push origin ":refs/tags/main-latest" || true
          gh release create main-latest \
            "release-assets/FootLive.exe#FootLive.exe" \
            "release-assets/FootLive.apk#FootLive.apk" \
            --target "$GITHUB_SHA" \
            --title "Latest main build" \
            --notes-file "WHATS_NEW.md" \
            --prerelease
