name: Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: FootLive-windows
          path: dist/FootLive.exe

      - name: Publish rolling main release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseExists = $false
          try {
            gh release view main-latest 2>$null
            $releaseExists = ($LASTEXITCODE -eq 0)
          } catch {
            $releaseExists = $false
          }

          if ($releaseExists) {
            gh release delete main-latest --yes --cleanup-tag
          }

          try {
            git push origin ":refs/tags/main-latest" 2>$null
          } catch {
          }

          gh release create main-latest `
            "dist/FootLive.exe#FootLive.exe" `
            --target "$env:GITHUB_SHA" `
            --title "Latest main build" `
            --notes "Automated Windows build from main commit $env:GITHUB_SHA" `
            --prerelease
